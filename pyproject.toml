[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-chat"
version = "0.1.0"
description = "Private LAN chat and document-correction website backed by Ollama"
requires-python = ">=3.11,<3.15"
dependencies = [
  "argon2-cffi>=23.1.0,<26",
  "fastapi>=0.115.0,<1",
  "fonttools>=4.0",
  "itsdangerous>=2.2.0,<3",
  "jinja2>=3.1.0,<4",
  "ollama>=0.5.0,<1",
  "pypdf>=5.0.0,<7",
  "python-docx>=1.1.0,<2",
  "python-dotenv>=1.0.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34.0,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0,<1",
  "pytest>=8.0.0,<9",
  "pytest-asyncio>=0.24.0,<1",
]

[project.scripts]
local-llm-create-user = "scripts.create_user:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
